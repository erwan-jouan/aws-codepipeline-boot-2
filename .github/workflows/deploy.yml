name: deploy
run-name: "deploy — ${{ inputs.deployment_name }}"

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment to deploy'
        required: true
        type: choice
        options:
          - alb-ecs-fargate
          - asg-rolling-update
          - ec2-image-builder

permissions:
  id-token: write
  contents: read

env:
  ROLE_NAME: GitHubActionsRole
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CICD_ACCOUNT_ID: ${{ secrets.AWS_CICD_ACCOUNT_ID }}
  PROD_ACCOUNT_ID: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
  AWS_ORGANIZATION_ID: ${{ secrets.AWS_ORGANIZATION_ID }}
  AWS_ORGANIZATION_UNIT_ID: ${{ secrets.AWS_ORGANIZATION_UNIT_ID }}
  AWS_GITHUB_CONNECTION_ARN: ${{ secrets.AWS_GITHUB_CONNECTION_ARN }}
  DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
  PROJECT_NAME: aws-codepipeline-boot-2
  PROJECT_DEPLOYMENT_NAME: aws-codepipeline-boot-2-${{ inputs.deployment_name }}
  TARGET_ARCHITECTURE: x86_64

jobs:
  launch-runner:
    uses: erwan-jouan/aws-accounts-utilities/.github/workflows/launch-runner.yml@main
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy:
    needs: launch-runner
    runs-on: [self-hosted, "${{ needs.launch-runner.outputs.runner-name }}"]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials (PROD account)
        if: inputs.deployment_name != 'ec2-image-builder'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PROD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy app stack
        if: inputs.deployment_name != 'ec2-image-builder'
        working-directory: infra/cdk
        run: |
          cdk deploy \
            --app "npx ts-node --prefer-ts-exts bin/${{ inputs.deployment_name }}/cdk.ts" \
            --require-approval never \
            ${{ inputs.deployment_name }}-app \
            --exclusively

      - name: Configure AWS credentials (CICD account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_CICD_ACCOUNT_ID }}:role/${{ env.ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy cicd stack
        working-directory: infra/cdk
        run: |
          cdk deploy \
            --app "npx ts-node --prefer-ts-exts bin/${{ inputs.deployment_name }}/cdk.ts" \
            --require-approval never \
            ${{ inputs.deployment_name }}-cicd \
            --exclusively
